<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<form action="/student/update" method="post" th:object="${student}">
    <input type="hidden" name="id" th:value="*{id}"/>
    <input class="form-control" type="text" name="name" placeholder="Name" th:value="*{name}"/>
    <input class="form-control" type="date" name="yob" placeholder="Year of birth" th:value="*{yob}"/>
    <input class="form-control" type="text" name="email" placeholder="Email" th:value="*{email}"/>
    <input class="form-control" type="text" name="phone" placeholder="Phone" th:value="*{phone}"/>
    <button class="btn btn-primary" type="submit">Update</button>
</form>

<h4>Available Course</h4>
<table class="table">
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Name</th>
        <th scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course: ${courses}">
        <td th:text="${course.id}"></td>
        <td th:text="${course.name}"></td>
        <td>
            <a th:href="@{/student/{stdId}/enroll/{courseId}(stdId=${student.id},courseId=${course.id})}">Enroll</a>
        </td>
    </tr>
    </tbody>
</table>

<h4>Enrollments</h4>
<table class="table">
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Course ID</th>
        <th scope="col">Course Name</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="enrollment : ${enrollments}">
        <td th:text="${enrollment.id}"></td>
        <td th:text="${enrollment.course.id}"></td>
        <td th:text="${enrollment.course.name}"></td>
    </tr>
    </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
